<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>會員登入 — 江湖藏書閣</title><link rel="stylesheet" href="./css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="./js/supabase.js"></script><script defer src="./js/common.js"></script><script defer src="./js/auth.js"></script></head>
<body class="auth-page"><header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">俠</span><span>江湖藏書閣<small>WUXIA LIBRARY</small></span></a><a class="nav-link" href="./index.html">← 返回書庫</a></header>
<main class="auth-wrap"><div class="auth-decoration"><div class="auth-seal">江湖<br>有書</div><div class="eyebrow">YOUR NEXT CHAPTER</div><h1>每一次翻頁，<br>都是新的相逢。</h1><p>登入後即可收藏作品，並在不同裝置之間延續閱讀。</p></div>
<section class="auth-card"><div class="auth-tabs"><button class="auth-tab active" data-mode="login">登入</button><button class="auth-tab" data-mode="signup">建立帳號</button></div><h2 id="authTitle">重返江湖</h2><p id="authSubtitle" class="muted">登入你的藏書閣帳號。</p><form id="authForm"><label class="field-label" for="email">電子郵件</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label class="field-label" for="password">密碼</label><input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="至少 6 個字元"><button class="button button-primary auth-submit" id="submitBtn" type="submit">登入</button></form><p id="authMessage" class="form-message" role="status"></p><p class="auth-footnote">註冊需要有效的電子郵件。若 Supabase 開啟郵件驗證，請先完成驗證再登入。</p></section></main></body></html>
