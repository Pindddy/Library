<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理後台 — 江湖藏書閣</title><link rel="stylesheet" href="./css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="./js/supabase.js"></script><script defer src="./js/common.js"></script><script defer src="./js/admin.js"></script></head>
<body><header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">俠</span><span>江湖藏書閣<small>WUXIA LIBRARY</small></span></a><nav class="nav"><a class="nav-link" href="./index.html">返回書庫</a><a class="nav-link" href="./account.html">我的書架</a></nav></header>
<main class="admin-main"><div class="eyebrow">LIBRARY MANAGEMENT</div><h1 class="page-title">藏書管理</h1><p class="page-lead">管理作者、作品及章節。只有已獲授權的管理員可以儲存變更。</p><div class="admin-warning" id="adminStatus">正在檢查管理員權限……</div>
<div class="admin-tabs"><button class="admin-tab active" data-panel="booksPanel">作品管理</button><button class="admin-tab" data-panel="authorsPanel">作者管理</button><button class="admin-tab" data-panel="chaptersPanel">章節管理</button></div>
<section class="admin-panel" id="booksPanel"><div class="admin-panel-heading"><h2>作品</h2><button class="button button-primary" id="newBookBtn">＋ 新增作品</button></div><form id="bookForm" class="admin-form" hidden><input type="hidden" id="bookId"><div class="form-grid"><label>作品名稱<input id="bookTitle" required maxlength="180"></label><label>作者<select id="bookAuthor" required></select></label><label>分類<input id="bookCategory" required placeholder="例如：經典武俠"></label><label>封面樣式<select id="bookCover"><option value="jade">墨綠</option><option value="red">朱紅</option><option value="blue">靛藍</option><option value="gold">赭金</option></select></label></div><label>作品簡介<textarea id="bookDescription" rows="3" maxlength="1000"></textarea></label><label class="inline-check"><input id="bookPublished" type="checkbox"> 公開顯示</label><div class="form-actions"><button class="button button-primary" type="submit">儲存作品</button><button class="button button-outline" type="button" id="cancelBookBtn">取消</button></div></form><div id="adminBooks" class="admin-table-wrap"></div></section>
<section class="admin-panel" id="authorsPanel" hidden><div class="admin-panel-heading"><h2>作者</h2></div><form id="authorForm" class="admin-form"><div class="form-grid"><label>作者姓名<input id="authorName" required maxlength="120"></label><label>簡介<input id="authorBio" maxlength="500" placeholder="簡短介紹（選填）"></label></div><div class="form-actions"><button class="button button-primary" type="submit">新增作者</button></div></form><div id="adminAuthors" class="admin-table-wrap"></div></section>
<section class="admin-panel" id="chaptersPanel" hidden><div class="admin-panel-heading"><h2>章節</h2><button class="button button-primary" id="newChapterBtn">＋ 新增章節</button></div><form id="chapterForm" class="admin-form" hidden><input type="hidden" id="chapterId"><div class="form-grid"><label>所屬作品<select id="chapterBook" required></select></label><label>章節標題<input id="chapterTitle" required maxlength="180"></label><label>章節順序<input id="chapterNumber" type="number" min="1" value="1" required></label><label class="inline-check"><input id="chapterPublished" type="checkbox"> 公開章節</label></div><label>正文<textarea id="chapterContent" rows="12" required placeholder="輸入你有權發布的小說正文……"></textarea></label><div class="form-actions"><button class="button button-primary" type="submit">儲存章節</button><button class="button button-outline" type="button" id="cancelChapterBtn">取消</button></div></form><div id="adminChapters" class="admin-table-wrap"></div></section><p id="adminMessage" class="form-message" role="status"></p></main></body></html>
